const W=[];let cu="";
RAW.trim().split("\n").forEach(l=>{if(/^U\d /.test(l))cu=l;else{const[f,d]=l.split("|");W.push({f,d,u:cu})}});
const units=[...new Set(W.map(w=>w.u))];
const $=id=>document.getElementById(id);
function boom(){praise();const c=["#3b6ea5","#8fa1b6","#6b94c2","#c3ced9"];for(let i=0;i<40;i++){const s=document.createElement("i");s.className="cf";s.style.cssText=`left:${50+(Math.random()-.5)*30}vw;top:45vh;background:${c[i%4]};--x:${(Math.random()-.5)*600}px;--y:${-Math.random()*350-100}px;--r:${Math.random()*720}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
const U=$("unit");U.innerHTML='<option value="">Alle Abschnitte ('+W.length+' Einträge)</option>'+units.map(u=>`<option>${u}</option>`).join("");
let tab="list",hide=0,dir=0,pool=[],card=null,flip=0,score=[0,0],mode="mc",qa=null;
const tabs={list:"📖 Liste",cards:"🃏 Karten",quiz:"❓ Quiz",type:"⌨️ Tippen"};
function nav(){$("tabs").innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';start()">${v}</button>`).join("")}
function filt(){const q=$("q").value.toLowerCase();return W.filter(w=>(!U.value||w.u==U.value)&&(!q||(w.f+w.d).toLowerCase().includes(q)))}
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const Q=w=>dir?w.d:w.f,A=w=>dir?w.f:w.d,esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function start(){dir=+$("dir").value;nav();pool=sh(filt());score=[0,0];flip=0;next(true)}
function next(first){if(tab=="list")return list();if(!pool.length){$("app").innerHTML="<p>Keine Treffer.</p>";return}
if(!first)pool.push(pool.shift());card=pool[0];flip=0;qa=null;draw()}
function list(){let h=`<div class="row"><button onclick="hide=!hide;list()">${hide?"Übersetzung zeigen":"Übersetzung verdecken"}</button></div><div class="sm">${filt().length} Einträge – Klick auf Zeile zum Aufdecken</div>`,last="";
filt().forEach((w,i)=>{if(w.u!=last){h+=`<div class="u">${w.u}</div>`;last=w.u}h+=`<div class="w ${hide?"h":""}" style="animation-delay:${Math.min(i,24)*35}ms" onclick="this.classList.toggle('h')"><b>${esc(w.f)}</b><span>${esc(w.d)}</span></div>`});$("app").innerHTML=h}
function draw(){const w=card;let h=`<div class="sm">Punkte: ${score[0]} / ${score[0]+score[1]} · ${pool.length} Karten im Stapel</div>`;
if(tab=="cards"){h+=`<div class="fc ${flip?'f':''}" onclick="flip=!flip;draw()">${esc(flip?A(w):Q(w))}</div><div class="row"><button onclick="rate(1)">✅ Gewusst</button><button onclick="rate(0)">❌ Nochmal</button></div>`}
else if(tab=="quiz"){if(!qa){const o=sh([w,...sh(W.filter(x=>x!=w)).slice(0,3)]);qa=o}
h+=`<div class="fc" style="min-height:110px;cursor:default">${esc(Q(w))}</div>`+qa.map((o,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})">${esc(A(o))}</button>`).join("")}
else{h+=`<div class="fc" style="min-height:110px;cursor:default">${esc(Q(w))}</div><div class="row"><input id="t" placeholder="Antwort…" autocomplete="off" onkeydown="if(event.key=='Enter')chk()"><button onclick="chk()">Prüfen</button></div><div id="r"></div>`}
$("app").innerHTML=h;if($("t"))$("t").focus()}
function rate(ok){if(ok)boom();score[ok?0:1]++;if(ok)pool.shift();else pool.push(pool.shift());if(!pool.length){$("app").innerHTML=`<h2>🎉 Geschafft!</h2><button onclick="start()">Neu starten</button>`;return}card=pool[0];flip=0;draw()}
function pick(i){const ok=qa[i]==card;if(ok)boom();document.getElementById("o"+i).classList.add(ok?"ok":"no");if(!ok)document.getElementById("o"+qa.indexOf(card)).classList.add("ok");score[ok?0:1]++;setTimeout(()=>next(),ok?500:1400)}
const norm=s=>s.toLowerCase().replace(/[.!?…()\/,;]/g," ").replace(/\s+/g," ").trim();
function chk(){const v=norm($("t").value),a=norm(A(card)),ok=v&&(v==a||a.split(/ ; |; /).some(x=>norm(x)==v));if(ok)boom();score[ok?0:1]++;$("r").innerHTML=`<p class="${ok?"ok":"no"}" style="padding:10px;border-radius:10px">${ok?"✅ Richtig!":"❌ Richtig wäre: "+esc(A(card))}</p><button onclick="next()">Weiter</button>`}
["q","unit","dir"].forEach(i=>$(i).addEventListener("input",start));
document.querySelector("h1").innerHTML="🇫🇷 "+[..."Français – Découvertes Vokabeltrainer"].map((c,i)=>`<span style="--i:${i}">${c==" "?"&nbsp;":c}</span>`).join("");
["bonjour","merci","la vie","un rêve","l'amitié","le chemin","Paris","Lille","un projet","salut","la rentrée","un concours"].forEach((t,i)=>{const s=document.createElement("span");s.className="fw";s.textContent=t;s.style.cssText=`left:${(i*8.5+Math.random()*4)%90}vw;font-size:${1+Math.random()*1.6}rem;animation-duration:${16+Math.random()*16}s;animation-delay:-${Math.random()*20}s;--rot:${(Math.random()-.5)*60}deg`;document.body.appendChild(s)});

function praise(){const p=document.createElement("div");p.className="praise";p.textContent=["Super!","Bravo!","Genau!","Top!","Magnifique!","Parfait!","Voilà!"][Math.random()*7|0];document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
start();
</script></body></html>
